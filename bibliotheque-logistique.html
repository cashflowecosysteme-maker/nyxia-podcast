<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bibliothèque logistique — NyXia</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#060A18;color:#f5f2ff;font:14px Montserrat,sans-serif}#starry-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.wrap{position:relative;z-index:1;max-width:1100px;margin:auto;padding:24px}.hero,.card{background:rgba(10,18,42,.85);border:1px solid #C9A24A55;border-radius:15px;padding:19px}.hero{margin-bottom:20px}h1{color:#C9A24A;margin:0 0 10px}h2{font-size:17px;color:#C9A24A;margin:0 0 8px}p{line-height:1.6;color:#cfcde2}label{display:block;margin:12px 0 5px;color:#C9A24A}select,input{background:#0b1430;border:1px solid #8e7e9b;border-radius:8px;color:white;padding:10px;font:inherit;max-width:100%;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px}.card{display:flex;flex-direction:column;gap:8px}.small{color:#a78bfa;font-size:12px}.note{font-size:12px;color:#c9c3da;margin:0}a{color:#e8c77b}button{font:inherit;background:transparent;border:1px solid #C9A24A;color:#e8c77b;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{background:#C9A24A22}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto;padding-top:10px}.empty{padding:24px}</style></head><body><canvas id="starry-canvas" aria-hidden="true"></canvas><main class="wrap"><header class="hero"><h1>✦ Bibliothèque logistique</h1><p>NyXia t’aide à choisir les logiciels pour enregistrer, recevoir tes invités, monter, sous-titrer et diffuser ton podcast. Choisis un outil pour comprendre son utilité et en discuter avec NyXia.</p><label for="category">Ton besoin</label><select id="category"><option value="">Tous les outils</option></select><label for="search">Rechercher un logiciel</label><input id="search" type="search" placeholder="Ex. StreamYard, sous-titres, invités..."></header><div class="grid" id="results" aria-live="polite"></div></main><script src="/js/podcast-logistique-data.js"></script><script>(function(){'use strict';const tools=window.NYXIA_LOGISTIQUE||[],cat=document.getElementById('category'),search=document.getElementById('search'),results=document.getElementById('results');[...new Set(tools.map(x=>x.category))].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});function el(tag,text,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;return e}function render(){results.replaceChildren();const q=search.value.toLocaleLowerCase('fr');const found=tools.filter(x=>(!cat.value||x.category===cat.value)&&(!q||[x.name,x.category,x.description].join(' ').toLocaleLowerCase('fr').includes(q)));if(!found.length){results.append(el('p','Aucun logiciel ne correspond à cette recherche.','empty'));return}found.forEach(x=>{const card=el('article','','card');card.append(el('div',x.category,'small'),el('h2',x.name),el('div',x.price,'small'),el('p',x.description),el('p',x.note,'note'));const actions=el('div','','actions');const ask=el('button','En parler avec NyXia');ask.type='button';ask.onclick=()=>{parent.postMessage({type:'nyxia_logistique_discuss',name:x.name},location.origin)};actions.append(ask);if(x.url){const link=el('a','Site officiel ↗');link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';actions.append(link)}card.append(actions);results.append(card)})}cat.onchange=render;search.oninput=render;render()})();</script><script src="/js/starry-bg.js" defer></script></body></html>
